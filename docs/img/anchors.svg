<text x="20.0" y="620.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="1.0">At beam 8 all three look at the same ~104 candidates — k=1: 86.7 % for 232 SP · k=4: 89.7 % for 621 SP · k=16: 93.3 % for 2108 SP.</text>
<text x="20.0" y="638.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="1.0">So anchors do what they promise: at an equal candidate count they raise recall by 3.0 and 6.6 points — the right panel is real, not a trick.</text>
<text x="20.0" y="656.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="1.0">The bill arrives on the left. Scoring every node against k anchors costs k times the descent, and widening the beam buys the same points cheaper:</text>
<text x="20.0" y="674.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="1.0">k=1 at beam 32 reaches 96.0 % for 787 SP, where k=16 needs 2108 SP for 93.3 %. Hence the default --anchors 1 — the option stays, the recommendation does not.</text>
